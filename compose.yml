name: "${COMPOSE_PROJECT_NAME:-bookssmf}"

services:
  app-php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    container_name: ${CONTAINER_NAME:-bookssmf}-app
    restart: ${CONTAINER_MODE:-unless-stopped}
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html/cn.bookssmf
    ports:
      - '${REVERB_SERVER_PORT:-8080}:8080'
    volumes:
      - .:/var/www/html/cn.bookssmf
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bookssmf_network

  nginx:
    image: nginx:1.27-alpine
    container_name: ${CONTAINER_NAME:-bookssmf}-nginx
    restart: ${CONTAINER_MODE:-unless-stopped}
    ports:
      - '${APP_PORT:-8089}:80'
    volumes:
      - .:/var/www/html/cn.bookssmf
      - ./docker/nginx/templates/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - app-php
    networks:
      - bookssmf_network

  db:
    image: postgres:17-alpine
    container_name: ${CONTAINER_NAME:-bookssmf}-db
    restart: ${CONTAINER_MODE:-unless-stopped}
    environment:
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
    volumes:
      - '${DB_DATA_STORAGE:-./docker/dockDB/data}:/var/lib/postgresql/data'
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - bookssmf_network
  
  mailer:
    image: axllent/mailpit:latest
    container_name: ${CONTAINER_NAME:-bookssmf}-mailer
    restart: ${CONTAINER_MODE:-unless-stopped}
    ports:
      - '${MAILER_HTTP_PORT:-8025}:8025' 
      - '${MAILER_SMTP_PORT:-1025}:1025' 
    environment:
      MP_MAX_MESSAGES: 200 
      MP_SMTP_AUTH_ACCEPT_ANY: 1 
      MP_SMTP_AUTH_ALLOW_INSECURE: 1 
    networks:
      - bookssmf_network

networks:
  bookssmf_network:
    driver: bridge
